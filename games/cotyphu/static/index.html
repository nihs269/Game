<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cờ Tỷ Phú</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎩</text></svg>">
  <link rel="stylesheet" href="/static/platform.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="/static/boardkit.css">
</head>
<body class="bk">
  <div class="bk-sky" aria-hidden="true"><div class="stars"></div><div class="orb"></div></div>
  <header class="topbar">
    <button id="btn-leave" class="icon-btn" title="Rời phòng">←</button>
    <div class="brand">🎩 <span>Cờ Tỷ Phú</span></div>
    <button id="btn-room" class="room-chip" title="Sao chép link mời">Phòng <b id="room-code">····</b> <span class="copy">⧉</span></button>
    <div class="spacer"></div>
    <div id="phase-pill" class="phase-pill"></div>
    <div id="timer" class="timer" hidden></div>
    <button id="btn-sound" class="icon-btn" title="Bật/tắt âm thanh">🔈</button>
    <button id="btn-guide" class="icon-btn" title="Hướng dẫn chơi">❓</button>
    <div id="conn" class="conn" title="Kết nối"></div>
  </header>
  <div class="timebar"><div id="timebar-fill"></div></div>

  <main class="layout">
    <aside class="lside"><div id="cast"></div></aside>

    <section class="stage">
      <div class="board-wrap">
        <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="bk-shade" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".18"/></linearGradient><linearGradient id="bk-wall" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".16"/></linearGradient></defs></svg>
        <div id="board" class="board">
          <div id="center" class="center">
            <div class="logo">CỜ TỶ PHÚ</div>
            <div id="banner" class="gbanner"></div>
            <div id="center-main" class="center-main"></div>
          </div>
          <div id="tokens" class="tokens"></div>
        </div>
      </div>
      <div id="panel"></div>
      <div id="emotes" class="emote-bar"></div>
    </section>

    <aside class="side">
      <nav class="tabs">
        <button data-tab="players" class="active">👥 Người chơi</button>
        <button data-tab="chat">💬 Trò chuyện <span id="unread" class="unread" hidden></span></button>
        <button data-tab="log">📜 Diễn biến</button>
      </nav>
      <div class="tab-body" data-body="players"><div id="plist" class="plist"></div></div>
      <div class="tab-body" data-body="chat" hidden>
        <div id="chat-list" class="chat-list"></div>
        <form id="chat-form" class="chat-form">
          <input id="chat-input" maxlength="300" autocomplete="off" placeholder="Nhập tin nhắn…">
          <button class="gh-btn primary small" type="submit">Gửi</button>
        </form>
      </div>
      <div class="tab-body" data-body="log" hidden><div id="log-list" class="log-list"></div></div>
    </aside>
  </main>

  <script src="/static/platform.js"></script>
  <script src="/static/avatar.js"></script>
  <script src="/static/guide.js"></script>
  <script src="/static/chatbubble.js"></script>
  <script src="/static/cast.js"></script>
  <script src="app.js"></script>
</body>
</html>
