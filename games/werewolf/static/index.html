<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ma Sói</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐺</text></svg>">
  <link rel="stylesheet" href="/static/platform.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="t-lobby">
  <div class="sky" aria-hidden="true"><div class="stars"></div><div class="stars s2"></div><div class="orb"></div></div>

  <header class="topbar">
    <button id="btn-leave" class="icon-btn" title="Rời phòng">←</button>
    <div class="brand">🐺 <span>Ma Sói</span></div>
    <button id="btn-room" class="room-chip" title="Sao chép link mời">Phòng <b id="room-code">····</b> <span class="copy">⧉</span></button>
    <div class="spacer"></div>
    <div id="voice-ctl" class="voice-ctl"></div>
    <div id="phase-pill" class="phase-pill"></div>
    <div id="timer" class="timer" hidden></div>
    <button id="btn-voice" class="icon-btn" title="Bật/tắt giọng quản trò">🔇</button>
    <select id="voice-accent" class="accent-sel" title="Giọng quản trò">
      <option value="north">Giọng Bắc</option>
      <option value="south">Giọng Nam</option>
    </select>
    <button id="btn-guide" class="icon-btn" title="Hướng dẫn chơi">❓</button>
    <div id="conn" class="conn" title="Kết nối"></div>
  </header>
  <div class="timebar"><div id="timebar-fill"></div></div>

  <main class="layout">
    <section class="stage">
      <div id="banner"></div>
      <div class="scene-box">
        <div id="scene"></div>
        <div id="action" class="action"></div>
      </div>
      <div id="emotes" class="emote-bar"></div>
      <div id="myrole"></div>
      <div id="lobby"></div>
    </section>

    <aside class="side">
      <nav class="tabs">
        <button data-tab="chat" class="active">💬 Trò chuyện <span id="unread" class="unread" hidden></span></button>
        <button data-tab="log">📜 Nhật ký</button>
        <button data-tab="roles">📖 Vai trò</button>
      </nav>
      <div class="tab-body" data-body="chat">
        <div id="chat-list" class="chat-list"></div>
        <form id="chat-form" class="chat-form">
          <span id="chat-channel" class="chat-channel"></span>
          <input id="chat-input" maxlength="300" autocomplete="off" placeholder="Nhập tin nhắn…">
          <button class="gh-btn primary small" type="submit">Gửi</button>
        </form>
      </div>
      <div class="tab-body" data-body="log" hidden><div id="log-list" class="log-list"></div></div>
      <div class="tab-body" data-body="roles" hidden><div id="roles-list" class="roles-list"></div></div>
    </aside>
  </main>

  <script src="/static/platform.js"></script>
  <script src="/static/avatar.js"></script>
  <script src="/static/guide.js"></script>
  <!-- Voice chat tạm tắt. Bật lại: bỏ comment dòng dưới + chạy main.py --https -->
  <!-- <script src="/static/voice.js"></script> -->
  <script src="scene.js"></script>
  <script src="app.js"></script>
</body>
</html>
